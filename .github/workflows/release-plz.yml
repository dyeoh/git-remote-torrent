name: release-plz

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  # Opens/updates a "chore: release" PR that bumps versions and CHANGELOG.md
  # from Conventional Commits. Merging it tags vX.Y.Z, which triggers release.yml.
  release-plz:
    runs-on: ubuntu-latest
    concurrency:
      group: release-plz
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: release-plz/action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
