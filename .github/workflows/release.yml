name: Release

on:
  # Called by release-plz.yml after it tags a release.
  workflow_call:
    inputs:
      tag:
        description: The release tag, such as v0.1.0.
        required: true
        type: string
  # Tags pushed by hand.
  push:
    tags: ["v*.*.*"]

env:
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write
  id-token: write # keyless cosign signing
  attestations: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - if: runner.os == 'Linux'
        run: pip install ziglang
      - run: cargo zigbuild --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name=git-remote-torrent-${TAG}-${{ matrix.target }}
          mkdir "$name"
          for bin in git-remote-torrent git-torrent git-torrentd; do
            cp "target/${{ matrix.target }}/release/$bin" "$name/"
          done
          cp README.md LICENSE-MIT LICENSE-APACHE "$name/"
          tar czf "$name.tar.gz" "$name"
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: "*.tar.gz"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: "*.tar.gz"

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - run: sha256sum -- *.tar.gz > SHA256SUMS
      - uses: sigstore/cosign-installer@v3
      - run: cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
      - run: gh release create "$TAG" --verify-tag --generate-notes -- ./*.tar.gz SHA256SUMS SHA256SUMS.sigstore.json
        env:
          GH_TOKEN: ${{ github.token }}
