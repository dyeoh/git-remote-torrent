name: Release

on:
  # Called by release-pr.yml after it tags a release.
  workflow_call:
    inputs:
      tag:
        description: The release tag, such as v0.1.0.
        required: true
        type: string
  # Rebuild an existing tag by hand: gh workflow run release.yml -f tag=v0.1.0
  workflow_dispatch:
    inputs:
      tag:
        description: The existing tag to build and publish, such as v0.1.0.
        required: true
        type: string
  # Tags pushed by hand.
  push:
    tags: ["v*.*.*"]
  # Build-only dry run when this workflow changes, so a broken release build
  # is caught before the next release.
  pull_request:
    paths: [.github/workflows/release.yml]

env:
  # Empty on pull requests: the dry run builds the PR's code and publishes nothing.
  TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}

permissions:
  contents: write
  id-token: write # keyless cosign signing
  attestations: write

jobs:
  build:
    strategy:
      # Let every target finish so one failure doesn't hide the others.
      fail-fast: false
      matrix:
        # Each target builds natively on a matching runner: no cross toolchain.
        # Apple's toolchain builds x86_64 on the arm64 macOS runner.
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG || github.sha }}
      # Inside the checkout, rustup uses the toolchain pinned in
      # rust-toolchain.toml, so the target is added to that toolchain.
      - run: rustup target add ${{ matrix.target }}
      # musl-gcc compiles C dependencies (ring) for the static musl binaries.
      - if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name=git-remote-torrent-${TAG:-dry-run}-${{ matrix.target }}
          mkdir "$name"
          for bin in git-remote-torrent git-torrent git-torrentd; do
            cp "target/${{ matrix.target }}/release/$bin" "$name/"
          done
          cp README.md LICENSE-MIT LICENSE-APACHE "$name/"
          tar czf "$name.tar.gz" "$name"
      - if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "*.tar.gz"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: "*.tar.gz"

  publish:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff
      - run: git cliff --latest --strip all > "$RUNNER_TEMP/notes.md"
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - run: sha256sum -- *.tar.gz > SHA256SUMS
      - uses: sigstore/cosign-installer@v3
      - run: cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
      - run: gh release create "$TAG" --verify-tag --notes-file "$RUNNER_TEMP/notes.md" -- ./*.tar.gz SHA256SUMS SHA256SUMS.sigstore.json
        env:
          GH_TOKEN: ${{ github.token }}
