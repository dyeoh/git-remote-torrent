name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  id-token: write # keyless cosign signing
  attestations: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - if: runner.os == 'Linux'
        run: pip install ziglang
      - run: cargo zigbuild --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name=git-remote-torrent-${GITHUB_REF_NAME}-${{ matrix.target }}
          mkdir "$name"
          for bin in git-remote-torrent git-torrent git-torrentd; do
            cp "target/${{ matrix.target }}/release/$bin" "$name/"
          done
          cp README.md LICENSE-MIT LICENSE-APACHE "$name/"
          tar czf "$name.tar.gz" "$name"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: "*.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: "*.tar.gz"

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - run: sha256sum *.tar.gz > SHA256SUMS
      - uses: sigstore/cosign-installer@v3
      - run: cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
      - run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes *.tar.gz SHA256SUMS SHA256SUMS.sigstore.json
        env:
          GH_TOKEN: ${{ github.token }}
