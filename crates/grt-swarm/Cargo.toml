[package]
name = "grt-swarm"
description = "DHT, BitTorrent and LAN discovery layer for git-remote-torrent."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"

[dependencies]
grt-core.workspace = true
# rust-tls keeps TLS on rustls/ring (no OpenSSL in static musl builds); the
# default http-api-client feature is not needed.
librqbit = { version = "9", default-features = false, features = ["rust-tls"] }
mainline = "8"
thiserror.workspace = true
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
grt-git.workspace = true
tempfile.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
