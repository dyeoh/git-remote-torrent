# Release flow: one version, one tag (vX.Y.Z), one CHANGELOG.md for the whole workspace.
# See docs/reference/versioning.md.

[workspace]
# Crates are not published to crates.io; released versions are read from git tags.
git_only = true
publish = false
# Release only when the release PR is merged, not on every push to main.
release_always = false
# All crates share the tag name, so `git_only` finds v0.1.0 for each of them.
# Only grt-helper actually creates it (see below).
git_tag_name = "v{{ version }}"
git_tag_enable = false
# release.yml creates the GitHub Release, with binaries, from the tag.
git_release_enable = false
changelog_config = "cliff.toml"
changelog_update = false

# grt-helper carries the release: it creates the tag and writes the root
# changelog, including commits from every other crate.
[[package]]
name = "grt-helper"
version_group = "workspace"
git_tag_enable = true
changelog_update = true
changelog_path = "CHANGELOG.md"
changelog_include = ["grt-core", "grt-git", "grt-swarm", "grt-upstream", "grt-cli", "grt-daemon"]

[[package]]
name = "grt-core"
version_group = "workspace"

[[package]]
name = "grt-git"
version_group = "workspace"

[[package]]
name = "grt-swarm"
version_group = "workspace"

[[package]]
name = "grt-upstream"
version_group = "workspace"

[[package]]
name = "grt-cli"
version_group = "workspace"

[[package]]
name = "grt-daemon"
version_group = "workspace"
